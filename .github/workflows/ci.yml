name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores de relleno: el build no se conecta a Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build # genera los tipos de rutas que usa tsc
      - run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters
      # Base temporal en el servidor de GitHub (no en tu PC): aplica las migraciones y prueba las reglas.
      - name: Levantar Supabase de prueba
        run: npx supabase start -x studio,imgproxy,vector,logflare,mailpit,edge-runtime,postgres-meta
      - run: npm run db:test
