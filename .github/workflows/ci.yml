name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Levantar Supabase local
        run: npx supabase start -x studio,imgproxy,vector,logflare,mailpit,edge-runtime,postgres-meta
      - name: Crear variables locales
        run: |
          status=$(npx supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL <<< "$status")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY <<< "$status")"
            echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY <<< "$status")"
          } > .env.local
      - run: npm run lint
      - run: npm run db:test
      - run: npm run build
      - run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
